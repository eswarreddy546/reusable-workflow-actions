name: Feature NodeJS Pipeline

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      component:
        required: true
        type: string
      environment:
        required: true
        type: string

env:
  ACC_ID: "526426842890"

jobs:
  feature-nodejs-pipeline:
    runs-on: self-hosted

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Display Repository
        run: |
          pwd
          ls -la
          ls -la catalogue

      - name: Generate Version
        run: |
          echo "APP_VERSION=${GITHUB_SHA::9}" >> $GITHUB_ENV

      - name: Print Inputs
        run: |
          echo "Project     : ${{ inputs.project }}"
          echo "Component   : ${{ inputs.component }}"
          echo "Environment : ${{ inputs.environment }}"
          echo "Version     : ${APP_VERSION}"

      - name: Install Dependencies
        working-directory: catalogue
        run: npm install

      - name: Run Unit Tests
        id: unit_tests
        working-directory: catalogue
        run: npm test

      - name: Docker Build
        id: docker_build
        working-directory: catalogue
        run: |
          docker build \
          -t ${ACC_ID}.dkr.ecr.us-east-1.amazonaws.com/${{ inputs.project }}/${{ inputs.component }}:${APP_VERSION} .
          docker images

      - name: Unit Test Status
        if: always()
        uses: daws-86s/workflows/.github/actions/update-commit-status@main
        with:
          sha: ${{ github.sha }}
          state: ${{ steps.unit_tests.outcome }}
          context: UNIT_TESTS
          description: ${{ steps.unit_tests.outcome }}

      - name: Docker Build Status
        if: always()
        uses: daws-86s/workflows/.github/actions/update-commit-status@main
        with:
          sha: ${{ github.sha }}
          state: ${{ steps.docker_build.outcome }}
          context: DOCKER_BUILD
          description: ${{ steps.docker_build.outcome }}